<mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

<div class="table-wrapper" [class.loading]="loading()">
  <table mat-table [dataSource]="data()" matSort (matSortChange)="onSort($event)" matSortDisableClear>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="id">Código</th>
      <td mat-cell *matCellDef="let row; trackBy: trackById">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="name">Nome</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>


    <ng-container matColumnDef="telephone">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="telephone">Telefone</th>
      <td mat-cell *matCellDef="let row">{{ row.telephone || '-' }}</td>
    </ng-container>


    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button matTooltip="Editar" (click)="openEditDialog(row.id)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" matTooltip="Excluir" (click)="confirmDelete(row)">
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()
    "
    [pageSizeOptions]="[5,10,25,50]"
    (page)="onPage($event)">
  </mat-paginator>
</div>
